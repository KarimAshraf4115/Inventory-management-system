services:
  backend:
    build: ./invoice-system
    ports:
      - "3000:3000"
    volumes:
      - db-data:/data

  frontend:
    build:
      context: ./invoice-system-ui
      args:
        VITE_API_BASE_URL: http://localhost:3000/api
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db-data: